<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="logo.png">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashpa Mishki</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 4px 0 0;
      color: #ccc;
    }

    #cartButton {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .search {
      padding: 15px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    #categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 15px 15px;
    }

    .category {
      border: 0;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active {
      background: #222;
      color: white;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      padding: 0 15px 30px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0001;
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .description {
      font-size: 13px;
      color: #777;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .add {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #0008;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }

    .hidden {
      display: none !important;
    }

    .cart {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 20px 20px 0 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close {
      border: 0;
      border-radius: 50%;
      padding: 8px 11px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .quantity button {
      border: 0;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      font-size: 20px;
      padding: 18px 0;
    }

    .whatsapp {
      width: 100%;
      border: 0;
      background: #25D366;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }

    @media (min-width: 700px) {
      .modal {
        align-items: center;
      }

      .cart {
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>🍬 Ashpa Mishki</h1>
    <p>Catálogo online</p>
  </div>

  <button id="cartButton">
    🛒 Carrito (<span id="cartCount">0</span>)
  </button>
</header>

<div class="search">
  <input
    type="text"
    id="search"
    placeholder="🔎 Buscar productos..."
  >
</div>

<div id="categories"></div>

<section id="products">
  <p>Cargando productos...</p>
</section>

<div id="cartModal" class="modal hidden">

  <div class="cart">

    <div class="cart-header">
      <h2>🛒 Tu pedido</h2>
      <button class="close" id="closeCart">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      Total:
      <strong id="total">$0</strong>
    </div>

    <button
      class="whatsapp"
      onclick="sendWhatsApp('543841419478')">
      📲 Enviar a WhatsApp 1
    </button>

    <button
      class="whatsapp"
      onclick="sendWhatsApp('543644144495')">
      📲 Enviar a WhatsApp 2
    </button>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://nwajxfyalfqqkgeaisfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Uc0_2gBzvfFVWTp1xDm3BA_NnIjHh-F";

let products = [];
let cart = [];
let selectedCategory = "Todas";


async function loadProducts() {

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/ahspamishki?select=*",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!response.ok) {
    document.getElementById("products").innerHTML =
      "<p>Error cargando productos.</p>";
    return;
  }

  products = await response.json();

  render();
}


function money(value) {

  return new Intl.NumberFormat(
    "es-AR",
    {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0
    }
  ).format(Number(value) || 0);

}


function render() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const categories = [
    "Todas",
    ...new Set(
      products
        .map(p => p.Categoria)
        .filter(Boolean)
    )
  ];

  document.getElementById("categories").innerHTML =
    categories.map(category => `
      <button
        class="category ${
          category === selectedCategory ? "active" : ""
        }"
        onclick="selectCategory('${category}')">
        ${category}
      </button>
    `).join("");


  const filtered =
    products.filter(product => {

      const categoryOK =
        selectedCategory === "Todas" ||
        product.Categoria === selectedCategory;

      const text =
        (
          product.Nombre +
          " " +
          (product.Descripcion || "")
        ).toLowerCase();

      return categoryOK && text.includes(search);

    });


  if (!filtered.length) {

    document.getElementById("products").innerHTML =
      "<p>No hay productos disponibles.</p>";

    return;

  }


  document.getElementById("products").innerHTML =
    filtered.map(product => `

      <article class="product">

        <img
          src="${
            product.Imagen ||
            "https://placehold.co/500x400?text=Ashpa+Mishki"
          }"
          alt="${product.Nombre}"
        >

        <div class="product-info">

          <h3>${product.Nombre}</h3>

          <div class="description">
            ${product.Descripcion || ""}
          </div>

          <div class="price">
            ${money(product.Precio)}
          </div>

          <button
            class="add"
            onclick="addToCart(${product.id})">
            Agregar al carrito
          </button>

        </div>

      </article>

    `).join("");

}


function selectCategory(category) {

  selectedCategory = category;

  render();

}


function addToCart(id) {

  const product =
    products.find(p => p.id === id);

  if (!product) return;

  const existing =
    cart.find(p => p.id === id);

  if (existing) {

    existing.quantity++;

  } else {

    cart.push({
      ...product,
      quantity: 1
    });

  }

  renderCart();

}


function changeQuantity(id, amount) {

  const item =
    cart.find(p => p.id === id);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {

    cart =
      cart.filter(p => p.id !== id);

  }

  renderCart();

}


function renderCart() {

  document.getElementById("cartCount").textContent =
    cart.reduce(
      (total, item) =>
        total + item.quantity,
      0
    );


  if (!cart.length) {

    document.getElementById("cartItems").innerHTML =
      "<p>El carrito está vacío.</p>";

    document.getElementById("total").textContent =
      "$0";

    return;

  }


  document.getElementById("cartItems").innerHTML =
    cart.map(item => `

      <div class="cart-item">

        <div>

          <strong>
            ${item.Nombre}
          </strong>

          <br>

          ${money(item.Precio)}
          × ${item.quantity}

        </div>

        <div class="quantity">

          <button
            onclick="changeQuantity(${item.id}, -1)">
            −
          </button>

          <button
            onclick="changeQuantity(${item.id}, 1)">
            +
          </button>

        </div>

      </div>

    `).join("");


  const total =
    cart.reduce(
      (sum, item) =>
        sum + Number(item.Precio) * item.quantity,
      0
    );


  document.getElementById("total").textContent =
    money(total);

}


function sendWhatsApp(number) {

  if (!cart.length) {

    alert("El carrito está vacío.");

    return;

  }


  let message =
    "Hola Ashpa Mishki! Quiero hacer este pedido:%0A%0A";


  cart.forEach(item => {

    message +=
      "• " +
      item.Nombre +
      " x" +
      item.quantity +
      " — " +
      money(
        Number(item.Precio) *
        item.quantity
      ) +
      "%0A";

  });


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        Number(item.Precio) *
        item.quantity,
      0
    );


  message +=
    "%0ATotal: " +
    money(total);


  window.location.href =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(
      decodeURIComponent(message)
    );

}


document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


document
  .getElementById("cartButton")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("cartModal")
        .classList
        .remove("hidden");

      renderCart();

    }
  );


document
  .getElementById("closeCart")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById("cartModal")
        .classList
        .add("hidden");

    }
  );


loadProducts();

</script>

</body>
</html>
