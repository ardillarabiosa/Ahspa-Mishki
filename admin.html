<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="logo.png">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ashpa Mishki</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#222;
    }

    header{
      background:#222;
      color:white;
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:22px;
    }

    main{
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:16px;
      margin-bottom:20px;
      box-shadow:0 2px 10px #0001;
    }

    h2{
      margin-top:0;
    }

    label{
      display:block;
      font-weight:bold;
      margin-top:14px;
      margin-bottom:6px;
    }

    input,textarea,select{
      width:100%;
      padding:12px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    button{
      border:0;
      border-radius:10px;
      padding:12px 15px;
      font-weight:bold;
      cursor:pointer;
    }

    .save{
      width:100%;
      background:#222;
      color:white;
      margin-top:18px;
    }

    .logout{
      background:white;
      color:#222;
    }

    .product{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .delete{
      background:#e53935;
      color:white;
    }

    .edit{
      background:#eee;
    }

    .actions{
      display:flex;
      gap:5px;
    }

    .hidden{
      display:none;
    }

    #message{
      margin-top:12px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🍬 Ashpa Mishki - Administración</h1>
  <button class="logout" onclick="logout()">Salir</button>
</header>

<main>

  <div class="box" id="loginBox">

    <h2>🔐 Administrador</h2>

    <label>Correo</label>
    <input id="email" type="email">

    <label>Contraseña</label>
    <input id="password" type="password">

    <button class="save" onclick="login()">
      Entrar
    </button>

    <div id="loginMessage"></div>

  </div>


  <div id="adminPanel" class="hidden">

    <div class="box">

      <h2>➕ Agregar producto</h2>

      <label>Nombre</label>
      <input id="nombre">

      <label>Descripción</label>
      <textarea id="descripcion"></textarea>

      <label>Precio</label>
      <input id="precio" type="number">

     <label>Imagen del producto</label>

<button type="button" onclick="abrirCamara()">
  📷 Sacar foto
</button>

<button type="button" onclick="abrirGaleria()">
  🖼️ Elegir de galería
</button>

<input id="imagenCamara" type="file" accept="image/*" capture="environment" style="display:none;">

<input id="imagenArchivo" type="file" accept="image/*" style="display:none;">

      <label>Categoría</label>
      <input id="categoria">

      <label>Stock</label>
      <input id="stock" type="number" value="0">

      <label>
        <input id="activo" type="checkbox" checked>
        Producto activo
      </label>

      <button class="save" onclick="saveProduct()">
        Guardar producto
      </button>

      <div id="message"></div>

    </div>


    <div class="box">

      <h2>📦 Productos</h2>

      <div id="productList">
        Cargando...
      </div>

    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://nwajxfyalfqqkgeaisfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Uc0_2gBzvfFVWTp1xDm3BA_NnIjHh-F";


let accessToken = null;
  
function abrirCamara(){
  document.getElementById("imagenCamara").click();
}

function abrirGaleria(){
  document.getElementById("imagenArchivo").click();
}

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );


  const data =
    await response.json();


  if(!response.ok){

    document.getElementById(
      "loginMessage"
    ).textContent =
      "❌ Correo o contraseña incorrectos.";

    return;
  }


  accessToken =
    data.access_token;


  document
    .getElementById("loginBox")
    .classList
    .add("hidden");


  document
    .getElementById("adminPanel")
    .classList
    .remove("hidden");


  loadProducts();

}


async function loadProducts(){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/ahspamishki?select=*&order=id.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken
        }
      }
    );


  const products =
    await response.json();


  document.getElementById(
    "productList"
  ).innerHTML =
    products.map(product => `

      <div class="product">

        <div>
          <strong>
            ${product.Nombre}
          </strong>

          <br>

          $${product.Precio}

          <br>

          Stock:
          ${product.Stock}

        </div>

        <div class="actions">

  <button
    class="edit"
    onclick="editProduct(${product.id})">
    ✏️
  </button>

  <button
    class="delete"
    onclick="deleteProduct(${product.id})">
    🗑️
  </button>

</div>

      </div>

    `).join("")
    ||
    "<p>No hay productos todavía.</p>";

}


async function saveProduct(){
const archivo =
  document.getElementById("imagenCamara").files[0] ||
  document.getElementById("imagenArchivo").files[0];
  
  let imagenURL = "";

  if (archivo) {
    const nombreArchivo =
      Date.now() + "-" + archivo.name.replace(/\s+/g, "-");

    const subida = await fetch(
      SUPABASE_URL +
      "/storage/v1/object/productos/" +
      nombreArchivo,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": archivo.type
        },
        body: archivo
      }
    );

    if (!subida.ok) {
      const error = await subida.text();
      document.getElementById("message").textContent =
        "❌ Error al subir la imagen: " + error;
      return;
    }

    imagenURL =
      SUPABASE_URL +
      "/storage/v1/object/public/productos/" +
      nombreArchivo;
  }
  const product = {

    Nombre:
      document.getElementById("nombre").value,

    Descripcion:
      document.getElementById("descripcion").value,

    Precio:
      Number(
        document.getElementById("precio").value
      ),

    Imagen: imagenURL,
     

    Categoria:
      document.getElementById("categoria").value,

    Stock:
      Number(
        document.getElementById("stock").value
      ),

    Activo:
      document.getElementById("activo").checked

  };


  if(!product.Nombre || !product.Precio){

    document.getElementById(
      "message"
    ).textContent =
      "⚠️ Poné al menos nombre y precio.";

    return;
  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/ahspamishki",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body:JSON.stringify(product)
      }
    );


  if(!response.ok){

    const error =
      await response.text();

    document.getElementById(
      "message"
    ).textContent =
      "❌ Error: " + error;

    return;
  }


  document.getElementById(
    "message"
  ).textContent =
    "✅ Producto guardado.";

  document
    .getElementById("nombre")
    .value="";

  document
    .getElementById("descripcion")
    .value="";

  document
    .getElementById("precio")
    .value="";

  document
    .getElementById("imagen")
    .value="";

  document
    .getElementById("categoria")
    .value="";

  document
    .getElementById("stock")
    .value="0";


  loadProducts();

}
async function editProduct(id){

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/ahspamishki?id=eq." +
    id,
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + accessToken
      }
    }
  );

  const products = await response.json();

  if(!products.length){
    alert("Producto no encontrado.");
    return;
  }

  const product = products[0];

  const nombre = prompt(
    "Nombre del producto:",
    product.Nombre
  );
  if(nombre === null) return;

  const precio = prompt(
    "Precio:",
    product.Precio
  );
  if(precio === null) return;

  const stock = prompt(
    "Stock:",
    product.Stock
  );
  if(stock === null) return;

  const descripcion = prompt(
    "Descripción:",
    product.Descripcion || ""
  );
  if(descripcion === null) return;

  const categoria = prompt(
    "Categoría:",
    product.Categoria || ""
  );
  if(categoria === null) return;

  const cambiarImagen = confirm(
  "¿Querés cambiar la imagen?"
);

let imagenURL = product.Imagen;

if(cambiarImagen){

  const input = document.createElement("input");

  input.type = "file";
  input.accept = "image/*";

  input.onchange = async function(){

    const archivo = input.files[0];

    if(!archivo){
      return;
    }

    const nombreArchivo =
      Date.now() +
      "-" +
      archivo.name.replace(/\s+/g, "-");

    const subida = await fetch(
      SUPABASE_URL +
      "/storage/v1/object/productos/" +
      nombreArchivo,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            archivo.type
        },

        body:archivo
      }
    );

    if(!subida.ok){

      const error =
        await subida.text();

      alert(
        "❌ Error al subir imagen: " +
        error
      );

      return;
    }

    imagenURL =
      SUPABASE_URL +
      "/storage/v1/object/public/productos/" +
      nombreArchivo;

    alert("✅ Imagen subida correctamente.");
  };

  input.click();
}
  const update = {

    Nombre: nombre,

    Precio:
      Number(precio),

    Stock:
      Number(stock),

    Descripcion:
      descripcion,

    Categoria:
      categoria,

    Imagen:
      imagenURL
  };


  const updateResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/ahspamishki?id=eq." +
      id,
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body:
          JSON.stringify(update)
      }
    );


  if(!updateResponse.ok){

    const error =
      await updateResponse.text();

    alert(
      "❌ Error al actualizar: " +
      error
    );

    return;
  }


  alert(
    "✅ Producto actualizado correctamente."
  );

  loadProducts();
}

async function deleteProduct(id){

  if(!confirm("¿Eliminar este producto?"))
    return;


  await fetch(
    SUPABASE_URL +
    "/rest/v1/ahspamishki?id=eq." +
    id,
    {
      method:"DELETE",

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":
          "Bearer " + accessToken
      }
    }
  );


  loadProducts();

}


function logout(){

  accessToken=null;

  document
    .getElementById("adminPanel")
    .classList
    .add("hidden");

  document
    .getElementById("loginBox")
    .classList
    .remove("hidden");

}


</script>

</body>
</html>
